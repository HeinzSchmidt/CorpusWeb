# =============================================================================
# CorpusWeb — local Docker deployment for testing.
#
#   docker compose up -d      # build (if needed) + start in background
#   docker compose logs -f    # watch container logs
#   docker compose down       # stop and remove the container (keeps the image)
#
# Host port 3500 is reserved for this service only. The corpus app runs
# elsewhere — do not publish any other ports from this file.
#
# No secrets live in this file or in the image. To exercise reCAPTCHA
# locally, create an UNTRACKED .env file next to this compose file
# (compose auto-loads it) with values from .env.example, e.g.:
#   RECAPTCHA_SECRET_KEY=...
#   VITE_RECAPTCHA_SITE_KEY=...
# =============================================================================
services:
  corpusweb:
    build:
      context: .
      dockerfile: Dockerfile
    image: corpusweb:local
    # Fixed container name so `docker logs corpusweb` is predictable.
    container_name: corpusweb
    ports:
      # host:container — 3500 is the only published port (see rule above).
      - "3500:3000"
    environment:
      # App listens on this port inside the container (server.ts default).
      PORT: "3000"
      # Stripe webhook -> Corpus internal premium sync (step 2). The secrets
      # stay empty by default so the route fails closed until .env provides
      # them; CORPUS_PREMIUM_URL defaults to the agreed Hetzner endpoint.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORPUS_PREMIUM_HMAC_SECRET: ${CORPUS_PREMIUM_HMAC_SECRET:-}
      CORPUS_PREMIUM_URL: ${CORPUS_PREMIUM_URL:-https://corpus-api.cybrnut.com/internal/premium}
      # Guest checkout (P4): Stripe Checkout Session creation. Checkout-write-
      # only restricted key + price id; values stay in the untracked .env.
      # Left empty here so /api/checkout fails closed (503) until provided.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID:-}
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-}
      # Contact form delivery (POST /api/contact): nodemailer SMTP +
      # recipient. Values stay in the untracked .env; empty by default so
      # the route fails closed (4xx JSON) until provided. CONTACT_TO is
      # optional — when unset, enquiries go to MAIL_FROM.
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASS: ${MAIL_SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CONTACT_TO: ${CONTACT_TO:-}
      # Optionally pin the site origin used for canonical/OG meta injection.
      # Left unset on purpose: server.ts derives it from the request Host
      # header, which correctly yields http://localhost:3500 locally.
      # APP_URL: "http://localhost:3500"
    restart: unless-stopped
